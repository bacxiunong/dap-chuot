services:
  app:
    build: .
    image: dap-chuot:latest
    container_name: dap-chuot
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      PORT: "3000"
      PGHOST: db
      PGPORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: dap-chuot-db
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Không mở cổng ra ngoài: chỉ dịch vụ app truy cập được database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
