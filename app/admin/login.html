<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Đăng nhập · Quản trị Đập Chuột</title>
<link rel="stylesheet" href="/design/tokens.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="login-page">
<main class="login-card">
  <h1>Quản trị</h1>
  <p class="muted">Đập Chuột 🐭</p>
  <form id="form-login" class="form" novalidate>
    <div class="field">
      <label for="username">Tên đăng nhập</label>
      <input id="username" name="username" class="input" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Mật khẩu</label>
      <input id="password" name="password" class="input" type="password" autocomplete="current-password" required>
    </div>
    <p class="help error" id="login-error" role="alert"></p>
    <button type="submit" class="btn btn-primary">Đăng nhập</button>
  </form>
</main>
<script src="admin.js"></script>
</body>
</html>
